# Throwaway servers for trying SSH tunnels and remote databases (scripts/test-env.sh up|down).
# Only sshd is reachable from the host, on 127.0.0.1:2222. The databases sit on an internal network behind it, so
# they answer only through a tunnel: connect with SSH host 127.0.0.1:2222 and database host `postgres` or `mysql`.
name: tableminus-test

services:
  sshd:
    image: alpine:3.20
    ports: ["127.0.0.1:2222:22"]
    volumes: ["${KEYS:?run scripts/test-env.sh}:/keys:ro"]
    networks: [front, back]
    # User `tunnel`: password `tunnelpass`, or the key in .test-env/.
    command: >
      sh -c "apk add --no-cache openssh >/dev/null &&
      adduser -D tunnel && echo 'tunnel:tunnelpass' | chpasswd &&
      install -d -m 700 -o tunnel /home/tunnel/.ssh &&
      install -m 600 -o tunnel /keys/id_ed25519.pub /home/tunnel/.ssh/authorized_keys &&
      ssh-keygen -A &&
      exec /usr/sbin/sshd -D -e -o AllowTcpForwarding=yes -o PasswordAuthentication=yes -o PermitRootLogin=no"
    healthcheck: { test: ["CMD", "pgrep", "sshd"], interval: 2s, retries: 30 }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: testpass, POSTGRES_DB: app }
    networks: [back]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: testpass, MYSQL_DATABASE: app }
    networks: [back]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptestpass"], interval: 3s, retries: 40 }

  # Reachable directly (127.0.0.1:26257, user root, no password, sslmode=disable) as well as through sshd.
  cockroach:
    image: cockroachdb/cockroach:v25.1.0
    command: start-single-node --insecure
    ports: ["127.0.0.1:26257:26257"]
    networks: [front, back]
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:8080/health?ready=1"], interval: 2s, retries: 40 }

  # Reachable directly: 127.0.0.1:1433, user sa, password TestPass1!word. An amd64 image, so it runs emulated on Apple
  # silicon and takes a minute to start.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "TestPass1!word" }
    ports: ["127.0.0.1:1433:1433"]
    networks: [front, back]
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      retries: 60

  # Reachable directly over HTTP: 127.0.0.1:8123, user tm, password testpass, database app.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment: { CLICKHOUSE_USER: tm, CLICKHOUSE_PASSWORD: testpass, CLICKHOUSE_DB: app, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
    ports: ["127.0.0.1:8123:8123"]
    networks: [front, back]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"], interval: 3s, retries: 40 }

  # Reachable directly: 127.0.0.1:27018 (27017 is often a local mongod already), user tm, password testpass,
  # authSource admin.
  mongo:
    image: mongo:8.0
    environment: { MONGO_INITDB_ROOT_USERNAME: tm, MONGO_INITDB_ROOT_PASSWORD: testpass }
    ports: ["127.0.0.1:27018:27017"]
    networks: [front, back]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"], interval: 3s, retries: 40 }

  # Reachable directly: 127.0.0.1:9042, no user. Takes half a minute to start answering.
  cassandra:
    image: cassandra:5
    environment: { MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M }
    ports: ["127.0.0.1:9042:9042"]
    networks: [front, back]
    healthcheck: { test: ["CMD", "cqlsh", "-e", "describe keyspaces"], interval: 5s, retries: 60 }

  # Reachable directly over HTTP: 127.0.0.1:9050, project tm, dataset app, no key.
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    command: ["--project=tm", "--dataset=app"]
    ports: ["127.0.0.1:9050:9050"]
    networks: [front, back]

  # Reachable directly: 127.0.0.1:1521, service FREEPDB1, user tm, password testpass (system has the same password).
  # The app needs Oracle Instant Client to connect.
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment: { ORACLE_PASSWORD: testpass, APP_USER: tm, APP_USER_PASSWORD: testpass }
    ports: ["127.0.0.1:1521:1521"]
    networks: [front, back]
    healthcheck: { test: ["CMD", "healthcheck.sh"], interval: 5s, retries: 60 }

  # Reachable directly over HTTP: 127.0.0.1:9200, security off (no user, no TLS).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["127.0.0.1:9200:9200"]
    networks: [front, back]
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:9200"], interval: 3s, retries: 60 }

  # Reachable directly over HTTP: 127.0.0.1:8001, any access key and secret (DynamoDB Local doesn't check them).
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["127.0.0.1:8001:8000"]
    networks: [front, back]

  # Reachable directly over HTTP: 127.0.0.1:8080, no auth token (Hrana over HTTP, as Turso serves it).
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports: ["127.0.0.1:8080:8080"]
    networks: [front, back]

  # The servers the #[ignore]d MySQL, Postgres and Redis tests expect on their usual ports (scripts/test-live.sh), passwordless
  # superusers, so these trust every connection. Behind the `live` profile: `test-env.sh up` leaves them alone, as a
  # local server (DBngin) may hold those ports.
  live-mysql:
    # 8.0 to match the mysqldump a stock Ubuntu runner has: the backup test needs a client as new as the server.
    image: mysql:8.0
    command: --local-infile=1
    profiles: [live]
    environment: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes" }
    ports: ["127.0.0.1:3306:3306"]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"], interval: 2s, retries: 60 }

  live-postgres:
    # PostGIS for the geometry browse test. Its images are amd64 only; Apple silicon runs them under Rosetta.
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    profiles: [live]
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"], interval: 2s, retries: 60 }

  live-redis:
    image: redis:7
    profiles: [live]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 60 }

networks:
  front: {}
  back: { internal: true }
