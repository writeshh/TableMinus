[package]
name = "table-minus"
version = "1.0.0"
description = "Personal database client: Postgres, MySQL/MariaDB and SQLite"
authors = ["Ritesh Shrestha"]
edition = "2024"
publish = false
default-run = "table-minus"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "table_minus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: an agent's config file keeps its keys in their order when the MCP setup adds to it.
serde_json = { version = "1", features = ["preserve_order"] }
# Drivers (sql/driver.rs) are trait objects with async methods; already in the tree through tokio-postgres and rmcp.
async-trait = "0.1"
tokio-postgres = "0.7.18"
postgres-protocol = "0.6.12"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
# Already in the tree through postgres-native-tls; the AI assistant's HTTPS client uses it directly.
tokio-native-tls = "0.3.1"
# Already in the tree; Basic credentials for the AI proxy.
base64 = "0.22"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
url = "2.5.8"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher", "backup"] }
# DuckDB, built from source into the app (a long first compile, no library to install).
duckdb = { version = "1.10506", features = ["bundled"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
bytes = "1"
secrecy = { version = "0.10", features = ["serde"] }
tokio = { version = "1", features = ["time", "process", "net", "io-std", "io-util", "rt-multi-thread", "sync"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-config = "0.58.0"
tauri-plugin-dialog = "2"
# Updates from GitHub Releases, signed with the key build.sh finds (app/updater.rs). No `zip`: v2 update artifacts
# are the installers themselves, and the zip crate it would bring has open advisories.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
futures-util = { version = "0.3", default-features = false }
flate2 = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
dirs = "7"
argon2 = "0.6"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# Plugins run in QuickJS, with no file, network or app access but what app/plugins.rs gives them.
rquickjs = "0.14"
tokio-util = { version = "0.7.20", features = ["compat"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "rust_decimal", "chrono"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# MongoDB's official driver (bson 2 through compat-3-0-0, rustls with ring as the rest of the app).
mongodb = "3.9.1"
# Cassandra (and ScyllaDB) over CQL's native protocol, TLS through rustls as the rest of the app.
scylla = { version = "1.9", features = ["rustls-023"] }
# The system's trusted certificates for rustls (Cassandra's TLS); already in the tree through mongodb.
rustls-native-certs = "0.8"
# Oracle through ODPI-C, which loads the user's Oracle Instant Client at run time (not at build time).
oracle = "0.6.3"
# RS256 signatures for Google service account sign-in (BigQuery); already in the tree through rustls.
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
robius-authentication = "0.3.1"


[dev-dependencies]
# Property tests for the read-only check and SQL quoting (safety/readonly.rs, sql/db.rs).
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
# cargo-fuzz builds with --cfg fuzzing (fuzz/README.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
overflow-checks = true # release builds otherwise wrap integers silently
# panic stays "unwind": a panic fails one command instead of killing the app
strip = true
