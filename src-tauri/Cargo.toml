[package]
name = "db-manager"
version = "0.1.0"
description = "Personal database client: Postgres, MySQL/MariaDB and SQLite"
authors = ["Ritesh Shrestha"]
edition = "2024"
default-run = "db-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "db_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
url = "2.5.8"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher", "backup"] }
sqlparser = { version = "0.63.0", features = ["visitor"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
bytes = "1"
secrecy = { version = "0.10", features = ["serde"] }
tokio = { version = "1", features = ["time", "process", "net", "io-std", "io-util", "rt-multi-thread"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-config = "0.58.0"
tauri-plugin-dialog = "2"
futures-util = { version = "0.3", default-features = false }
flate2 = "1"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
dirs = "7"
argon2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
robius-authentication = "0.3.1"


[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
overflow-checks = true # release builds otherwise wrap integers silently
# panic stays "unwind": a panic fails one command instead of killing the app
strip = true
